nodeLinker: node-modules

# Yarn refuses any version published less than `npmMinimalAgeGate` minutes ago
# (default 1440 = 24h) as a supply-chain guard. rangutopia is our own tooling
# and 0.3.1 was needed the day it shipped, so it is exempted by exact version —
# not by name — so future releases still go through the age gate.
npmPreapprovedPackages:
  - rangutopia@0.3.1
